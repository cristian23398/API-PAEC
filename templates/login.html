<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 PAEC · Acceso</title>
    <style>
        :root {
            --primary-pink: #ff85a2;
            --dark-pink: #f45b7e;
            --soft-pink: #ffeef2;
            --text-dark: #4a3b40;
            --bg-gradient: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-dark);
            padding: 20px;
        }

        .logos-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .logos-top img {
            height: 65px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.1));
        }

        .logos-top .divider {
            width: 1px;
            height: 55px;
            background: rgba(244, 91, 126, 0.3);
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 12px 35px rgba(244, 91, 126, 0.12);
            border: 1px solid rgba(255, 133, 162, 0.2);
            animation: cardFadeIn 0.6s ease;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 160px;
            height: 160px;
            object-fit: contain;
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #eedad3;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 11px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            color: #bfaab1;
            transition: all 0.3s;
            font-family: inherit;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary-pink), var(--dark-pink));
            color: white;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .input-group { margin-bottom: 14px; }

        label {
            display: block;
            font-size: 0.85em;
            font-weight: 600;
            color: #8a7a80;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #eedad3;
            border-radius: 12px;
            font-size: 1em;
            outline: none;
            transition: all 0.3s;
            color: var(--text-dark);
        }

        input:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 8px rgba(255, 133, 162, 0.2);
        }

        input::placeholder { color: #bfaab1; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: linear-gradient(135deg, var(--primary-pink) 0%, var(--dark-pink) 100%);
            border: none;
            color: white;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(244, 91, 126, 0.3);
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(244, 91, 126, 0.4);
        }

        .msg {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9em;
            text-align: center;
            display: none;
        }

        .msg.error { background: #fff0f0; color: #d93856; border: 1px solid #ffccd5; }
        .msg.success { background: #f0fff4; color: #2e7d32; border: 1px solid #a5d6a7; }

        .ods-banner {
            margin-top: 20px;
            width: 100%;
            max-width: 380px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .ods-banner img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="logos-top">
        <img src="/static/logo_cbtis.png" alt="CBTIS 75">
        <div class="divider"></div>
        <img src="/static/logo_dgeti.png" alt="DGETI Guanajuato">
    </div>

    <div class="login-box">
        <div class="logo-container">
            <img src="/static/logo.png" alt="Logo PAEC">
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarTab('login')">Iniciar Sesión</button>
            <button class="tab-btn" onclick="cambiarTab('registro')">Crear Cuenta</button>
        </div>

        <!-- LOGIN -->
        <div id="tab-login" class="tab-content active">
            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" id="login-email" placeholder="tu@correo.com" required>
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="login-pass" placeholder="••••••••" required>
            </div>
            <button class="btn-submit" onclick="hacerLogin()">Entrar</button>
            <div class="msg" id="login-msg"></div>
        </div>

        <!-- REGISTRO -->
        <div id="tab-registro" class="tab-content">
            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" id="reg-email" placeholder="tu@correo.com" required>
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres" required>
            </div>
            <div class="input-group">
                <label>Confirmar contraseña</label>
                <input type="password" id="reg-pass2" placeholder="Repite tu contraseña" required>
            </div>
            <button class="btn-submit" onclick="hacerRegistro()">Crear Cuenta</button>
            <div class="msg" id="reg-msg"></div>
        </div>
    </div>

    <div class="ods-banner">
        <img src="/static/logo_ods.png" alt="ODS">
    </div>

    <script>
        function cambiarTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'registro' && i === 1));
            });
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            document.getElementById('tab-registro').classList.toggle('active', tab === 'registro');
        }

        function mostrarMsg(id, texto, tipo) {
            const el = document.getElementById(id);
            el.textContent = texto;
            el.className = `msg ${tipo}`;
            el.style.display = 'block';
        }

        async function hacerLogin() {
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value;

            if (!email || !pass) {
                mostrarMsg('login-msg', 'Completa todos los campos.', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('usuario', email);
            formData.append('password', pass);

            try {
                const res = await fetch('/login-check', { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('userEmail', data.usuario);
                    localStorage.setItem('userRol', data.rol);
                    window.location.href = '/';
                } else {
                    mostrarMsg('login-msg', data.detail || 'Error al iniciar sesión.', 'error');
                }
            } catch {
                mostrarMsg('login-msg', 'Error de conexión.', 'error');
            }
        }

        async function hacerRegistro() {
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const pass = document.getElementById('reg-pass').value;
            const pass2 = document.getElementById('reg-pass2').value;

            if (!email || !pass || !pass2) {
                mostrarMsg('reg-msg', 'Completa todos los campos.', 'error');
                return;
            }

            if (pass.length < 6) {
                mostrarMsg('reg-msg', 'La contraseña debe tener al menos 6 caracteres.', 'error');
                return;
            }

            if (pass !== pass2) {
                mostrarMsg('reg-msg', 'Las contraseñas no coinciden.', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('usuario', email);
            formData.append('password', pass);

            try {
                const res = await fetch('/registro', { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok) {
                    mostrarMsg('reg-msg', '¡Cuenta creada! Iniciando sesión...', 'success');
                    localStorage.setItem('userEmail', data.usuario);
                    localStorage.setItem('userRol', data.rol);
                    setTimeout(() => window.location.href = '/', 1200);
                } else {
                    mostrarMsg('reg-msg', data.detail || 'Error al registrarse.', 'error');
                }
            } catch {
                mostrarMsg('reg-msg', 'Error de conexión.', 'error');
            }
        }

        // Enter para submit
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const loginActivo = document.getElementById('tab-login').classList.contains('active');
                if (loginActivo) hacerLogin();
                else hacerRegistro();
            }
        });
    </script>
</body>
</html>
