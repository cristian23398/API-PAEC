<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Iniciar Sesión 🌸</title>
    <style>
        :root {
            --primary-pink: #ff85a2;
            --dark-pink: #f45b7e;
            --soft-pink: #ffeef2;
            --text-dark: #4a3b40;
            --bg-gradient: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            background: var(--bg-gradient); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-dark);
            padding: 20px;
        }

        /* Logos institucionales arriba */
        .logos-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .logos-top img {
            height: 70px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.1));
        }

        .logos-top .divider {
            width: 1px;
            height: 60px;
            background: rgba(244, 91, 126, 0.3);
        }

        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 24px; 
            width: 100%;
            max-width: 360px; 
            box-shadow: 0 12px 35px rgba(244, 91, 126, 0.12); 
            border: 1px solid rgba(255, 133, 162, 0.2);
            animation: cardFadeIn 0.6s ease;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 180px;
            height: 180px;
            object-fit: contain;
        }

        h1 { 
            text-align: center; 
            color: var(--dark-pink); 
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 30px;
            margin-top: 0;
            position: relative;
        }

        h1::after {
            content: " 🎀";
            font-size: 0.9em;
            vertical-align: middle;
        }

        .input-group {
            position: relative;
            margin-top: 18px;
        }

        input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 2px solid #eedad3; 
            border-radius: 14px; 
            font-size: 1em;
            outline: none;
            transition: all 0.3s ease;
            color: var(--text-dark);
        }

        input:focus { 
            border-color: var(--primary-pink);
            box-shadow: 0 0 8px rgba(255, 133, 162, 0.2);
        }

        input::placeholder { color: #bfaab1; }

        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 28px; 
            background: linear-gradient(135deg, var(--primary-pink) 0%, var(--dark-pink) 100%); 
            border: none; 
            color: white; 
            border-radius: 14px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(244, 91, 126, 0.3);
            transition: all 0.3s ease;
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(244, 91, 126, 0.4);
        }

        /* ODS abajo */
        .ods-banner {
            margin-top: 25px;
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .ods-banner img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 400px) {
            .logos-top img { height: 50px; }
            .login-box { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- Logos institucionales -->
    <div class="logos-top">
        <img src="/static/logo_cbtis.png" alt="CBTIS 75">
        <div class="divider"></div>
        <img src="/static/logo_dgeti.png" alt="DGETI Guanajuato">
    </div>

    <div class="login-box">
        <!-- Logo PAEC -->
        <div class="logo-container">
            <img src="/static/logo.png" alt="Logo PAEC">
        </div>
        <h1>Registro / Login</h1>
        <form id="loginForm" action="/registro" method="post">
            <div class="input-group">
                <input type="email" name="usuario" id="emailInput" placeholder="Correo electrónico" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Contraseña" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <!-- Banner ODS -->
    <div class="ods-banner">
        <img src="/static/logo_ods.png" alt="Objetivos de Desarrollo Sostenible">
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = function() {
            const email = document.getElementById('emailInput').value;
            localStorage.setItem('userEmail', email.toLowerCase().trim());
        };
    </script>
</body>
</html>
