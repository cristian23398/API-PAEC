<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body{ margin:0; height:100vh; display:flex; justify-content:center; align-items:center; background:#f0f2f5; font-family:Arial; }
        .login-box{ background:white; padding:40px; border-radius:10px; width:350px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
        h1{ text-align:center; color:#333; }
        input{ width:100%; padding:12px; margin-top:15px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; }
        button{ width:100%; padding:12px; margin-top:20px; background:#007bff; border:none; color:white; border-radius:6px; cursor:pointer; font-size:16px; }
        button:hover{ background:#0056b3; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Registro / Login</h1>
        <form id="loginForm" action="/registro" method="post">
            <input type="email" name="usuario" id="emailInput" placeholder="Correo electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <script>
        // Guardamos el correo localmente para que la siguiente página sepa quién eres
        document.getElementById('loginForm').onsubmit = function() {
            const email = document.getElementById('emailInput').value;
            localStorage.setItem('userEmail', email.toLowerCase().trim());
        };
    </script>
</body>
</html>
