<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Bitácora - Gestión Total</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; }
        
        header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        
        /* Navegación de Miniaturas */
        .nav-container { background: white; padding: 15px; display: flex; gap: 15px; overflow-x: auto; border-bottom: 2px solid #ddd; }
        .thumb { min-width: 100px; height: 70px; border-radius: 8px; cursor: pointer; border: 3px solid transparent; object-fit: cover; transition: 0.3s; }
        .thumb.active { border-color: var(--accent); transform: translateY(-5px); }
        .btn-add-week { min-width: 100px; height: 70px; border: 2px dashed #bbb; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #888; }

        /* Panel Central */
        .main-panel { max-width: 1000px; margin: 20px auto; background: white; border-radius: 12px; padding: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .actions-bar { display: flex; gap: 10px; margin-bottom: 20px; justify-content: flex-end; }
        
        .content-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .img-grid img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }

        /* Botones */
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-edit { background: #3498db; color: white; }
        .btn-delete { background: var(--danger); color: white; }
        .btn-save { background: var(--accent); color: white; width: 100%; margin-top: 15px; }

        /* Formulario Flotante (Modal) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-body { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

<header>
    <h1>Administrador de Bitácora</h1>
    <p>Gestiona las semanas de tu proyecto agrícola</p>
</header>

<div class="nav-container" id="nav-bar">
    </div>

<main class="main-panel" id="display-panel">
    </main>

<div id="editorModal" class="modal">
    <div class="modal-body">
        <h2 id="modal-title">Editar Semana</h2>
        <input type="hidden" id="form-index">
        <label>Título de la Actividad:</label>
        <input type="text" id="form-titulo" placeholder="Ej: Germinación inicial">
        <label>Fecha:</label>
        <input type="text" id="form-fecha" placeholder="Ej: 01-07 Mayo">
        <label>Descripción (Observaciones):</label>
        <textarea id="form-obs" rows="4"></textarea>
        <label>URLs de Imágenes (separadas por coma):</label>
        <textarea id="form-imgs" placeholder="http://imagen1.jpg, http://imagen2.jpg"></textarea>
        
        <button class="btn btn-save" onclick="handleSave()">Guardar Cambios</button>
        <button class="btn" style="width:100%; margin-top:5px;" onclick="closeModal()">Cancelar</button>
    </div>
</div>

<script>
    // 1. CARGA INICIAL DE DATOS (Intentar leer de LocalStorage o usar default)
    let defaultData = [
        { titulo: "Plantación Inicial", fecha: "Semana 1", obs: "Se preparó el terreno.", imgs: ["/static/plt.jpg"] }
    ];
    
    let semanas = JSON.parse(localStorage.getItem('bitacoraData')) || defaultData;
    let currentIndex = 0;

    // 2. RENDERIZAR NAVEGACIÓN
    function renderNav() {
        const nav = document.getElementById('nav-bar');
        nav.innerHTML = semanas.map((s, i) => `
            <img src="${s.imgs[0]}" class="thumb ${i === currentIndex ? 'active' : ''}" onclick="changeWeek(${i})">
        `).join('');
        
        nav.innerHTML += `<div class="btn-add-week" onclick="openModal(true)">+</div>`;
    }

    // 3. RENDERIZAR PANEL CENTRAL
    function renderContent() {
        const panel = document.getElementById('display-panel');
        const s = semanas[currentIndex];

        if(!s) { panel.innerHTML = "<h2>No hay datos. Haz clic en + para agregar.</h2>"; return; }

        panel.innerHTML = `
            <div class="actions-bar">
                <button class="btn btn-edit" onclick="openModal(false)">✏️ Editar Semana</button>
                <button class="btn btn-delete" onclick="deleteWeek()">🗑️ Eliminar</button>
            </div>
            <div class="content-layout">
                <div>
                    <h2>${s.titulo}</h2>
                    <p><strong>Rango:</strong> ${s.fecha}</p>
                    <hr>
                    <h4>Observaciones:</h4>
                    <p>${s.obs}</p>
                </div>
                <div class="img-grid">
                    ${s.imgs.map(img => `<img src="${img}">`).join('')}
                </div>
            </div>
        `;
    }

    // 4. FUNCIONES DE LÓGICA
    function changeWeek(index) {
        currentIndex = index;
        renderNav();
        renderContent();
    }

    function openModal(isNew = false) {
        const modal = document.getElementById('editorModal');
        document.getElementById('modal-title').innerText = isNew ? "Agregar Nueva Semana" : "Editar Semana";
        
        if(isNew) {
            document.getElementById('form-index').value = "NEW";
            document.getElementById('form-titulo').value = "";
            document.getElementById('form-fecha').value = "";
            document.getElementById('form-obs').value = "";
            document.getElementById('form-imgs').value = "";
        } else {
            const s = semanas[currentIndex];
            document.getElementById('form-index').value = currentIndex;
            document.getElementById('form-titulo').value = s.titulo;
            document.getElementById('form-fecha').value = s.fecha;
            document.getElementById('form-obs').value = s.obs;
            document.getElementById('form-imgs').value = s.imgs.join(', ');
        }
        modal.style.display = 'flex';
    }

    function closeModal() { document.getElementById('editorModal').style.display = 'none'; }

    function handleSave() {
        const idx = document.getElementById('form-index').value;
        const newWeek = {
            titulo: document.getElementById('form-titulo').value,
            fecha: document.getElementById('form-fecha').value,
            obs: document.getElementById('form-obs').value,
            imgs: document.getElementById('form-imgs').value.split(',').map(i => i.trim())
        };

        if(idx === "NEW") {
            semanas.push(newWeek);
            currentIndex = semanas.length - 1;
        } else {
            semanas[idx] = newWeek;
        }

        saveAndRefresh();
        closeModal();
    }

    function deleteWeek() {
        if(confirm("¿Estás seguro de eliminar esta semana de la base de datos?")) {
            semanas.splice(currentIndex, 1);
            currentIndex = 0;
            saveAndRefresh();
        }
    }

    function saveAndRefresh() {
        // Guardar en LocalStorage (Persistencia en el navegador)
        localStorage.setItem('bitacoraData', JSON.stringify(semanas));
        
        // --- AQUÍ CONECTARÍAS TU MONGODB ---
        // fetch('/api/save', { method: 'POST', body: JSON.stringify(semanas) });
        
        renderNav();
        renderContent();
    }

    // Iniciar aplicación
    renderNav();
    renderContent();
</script>

</body>
</html>
