<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Actividades</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .btn-logout {
            position: absolute;
            right: 20px;
            top: 25px;
            background: #555;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .form-container {
            background: white;
            margin: 30px auto 10px auto;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            /* Por defecto oculto, se muestra solo a admins */
            display: none; 
        }

        .form-container h2 { margin-top: 0; color: #333; }

        .form-container input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1em;
            box-sizing: border-box;
        }

        .btn-agregar {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }

        .btn-agregar:hover { background-color: #218838; }

        .gallery-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .photo-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .photo-card:hover { transform: translateY(-10px); }

        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .photo-info { padding: 15px; }

        .photo-info h3 { margin: 0 0 10px 0; color: #444; font-size: 1.2em; }

        .photo-info p {
            margin: 0;
            color: #666;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .btn-eliminar {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            border: none;
            background-color: #dc3545;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background 0.3s;
        }

        .btn-eliminar:hover { background-color: #b52a37; }

        footer {
            background-color: #222;
            color: #bbb;
            text-align: center;
            padding: 20px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bitácora de Actividades</h1>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </header>

    <section class="form-container" id="adminSection">
        <h2>Agregar Actividad</h2>
        <form id="formAgregar">
            <input type="text" id="nombre" placeholder="Nombre de la actividad" required>
            <button type="submit" class="btn-agregar">Agregar Actividad</button>
        </form>
    </section>

    <main class="gallery-container" id="contenedor">
        </main>

    <footer>
        <p>Reporte Diario de Actividades - <strong>2024</strong></p>
    </footer>

    <script>
        // 1. Configuración de Identidad
        const userEmail = localStorage.getItem('userEmail') || "";
        // IMPORTANTE: Estos correos deben ser los mismos que en tu main.py
        const ADMINS = ["admin@correo.com", "tu_email@especial.com"]; 
        const esAdmin = ADMINS.includes(userEmail.toLowerCase().trim());

        // 2. Control Inicial de la Interfaz
        window.onload = () => {
            if (esAdmin) {
                document.getElementById('adminSection').style.display = 'block';
            }
            cargarActividades();
        };

        // 3. Cargar Actividades desde el Servidor
        async function cargarActividades() {
            const res = await fetch('/estudiantes'); // Usamos tu ruta de estudiantes
            const datos = await res.json();
            const contenedor = document.getElementById("contenedor");
            contenedor.innerHTML = "";

            datos.forEach(act => {
                const card = document.createElement("div");
                card.classList.add("photo-card");

                // Construimos el HTML. Solo añadimos el botón si esAdmin es true.
                let html = `
                    <img src="/static/plt.jpg" alt="Actividad">
                    <div class="photo-info">
                        <h3>${act.nombre}</h3>
                        <p>Actividad registrada en el sistema.</p>
                `;

                if (esAdmin) {
                    html += `
                        <button class="btn-eliminar" onclick="eliminarActividad('${act._id}')">
                            Eliminar
                        </button>
                    `;
                }

                html += `</div>`;
                card.innerHTML = html;
                contenedor.appendChild(card);
            });
        }

        // 4. Agregar Actividad (Solo Admin)
        document.getElementById("formAgregar").addEventListener("submit", async function(e) {
            e.preventDefault();
            const nombre = document.getElementById("nombre").value;

            const formData = new FormData();
            formData.append('nombre', nombre);
            formData.append('correo_solicitante', userEmail); // Validación para el servidor

            const res = await fetch('/agregar', {
                method: 'POST',
                body: formData
            });

            if (res.ok) {
                document.getElementById("nombre").value = "";
                cargarActividades();
            } else {
                alert("Error: No tienes permisos para realizar esta acción.");
            }
        });

        // 5. Eliminar Actividad (Solo Admin)
        async function eliminarActividad(id) {
            if (!confirm("¿Deseas eliminar esta actividad?")) return;

            const res = await fetch(`/eliminar/${id}?correo_solicitante=${encodeURIComponent(userEmail)}`, {
                method: 'DELETE'
            });

            if (res.ok) {
                cargarActividades();
            } else {
                alert("No tienes permisos para eliminar.");
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "/";
        }
    </script>
</body>
</html>
